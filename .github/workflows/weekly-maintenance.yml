name: Weekly maintenance

on:
  schedule:
    # Monday 06:00 UTC, before the week starts and well away from the daily snapshot.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  # Shared with the daily snapshot, so the two never push to main at the same time.
  group: data-snapshot
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Write the data-quality report and the changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: node scripts/weekly-maintenance.ts

      - name: Pick this week's author
        id: author
        run: node scripts/pick-author.ts

      - name: Commit and push
        id: commit
        env:
          GIT_AUTHOR_NAME: ${{ steps.author.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.author.outputs.email }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add public/data/report.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit --file "$RUNNER_TEMP/commit-message.txt"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: maintenance
    if: needs.maintenance.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.maintenance.outputs.sha }}
